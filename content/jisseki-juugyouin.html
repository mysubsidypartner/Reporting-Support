<p class="lead">小規模事業者として申請した方が、要件を満たしていることを示す書類です。</p>

<h2>提出前のチェック</h2>
<ul class="checks">
  <li>常時使用する従業員の人数が確認できること</li>
  <li>業種区分に応じた上限を超えていないこと</li>
  <li>作成日が記載されていること</li>
  <li>事業者名が申請内容と一致していること</li>
</ul>

<div class="callout">
  <strong>注意</strong>
  <p>小規模事業者として申請していない場合、この書類は不要です。役員や個人事業主本人は従業員数に含みません。</p>
</div>
