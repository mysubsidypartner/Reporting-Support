<p class="lead">「設置した状態の写真」と「ラベルの貼付が確認できる写真」を提出してください。ハードウェアを導入された方のみ対象です。</p>

<h2>必要な写真</h2>
<ul class="checks">
  <li>設置した状態の写真<span class="item-note">ハードウェア1台につき1枚</span></li>
  <li>ラベルの貼付が確認できる写真<span class="item-note">文字が読めるように撮影</span></li>
</ul>

<div class="callout">
  <strong>注意</strong>
  <p>導入したすべてのハードウェアの写真が必要です。</p>
  <p>設置状態がわかるよう、1台ずつ立ち上げた状態で撮影してください。</p>
  <p>PC、タブレット、モバイルPOSレジは、ソフトウェアを立ち上げた状態での写真が必要です。</p>
  <p>付属品・周辺機器を対象としている場合は、本体とともに確認できるよう撮影してください。</p>
</div>
