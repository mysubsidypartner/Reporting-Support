<p class="lead">補助金を受け取る口座情報を提出してください。</p>

<h2>必要な情報</h2>
<ol class="checks numbered">
  <li>金融機関名</li>
  <li>金融機関コード</li>
  <li>支店名</li>
  <li>口座種別</li>
  <li>口座番号</li>
  <li>口座名義人</li>
</ol>

<h2>提出書類の例</h2>
<ul class="checks">
  <li>通帳表紙 ＋ 通帳見開き（表紙の裏）の写真</li>
  <li>ネットバンクの口座情報ページのスクリーンショット</li>
</ul>

<div class="callout">
  <strong>当座預金の場合</strong>
  <p>「当座勘定入金帳」「当座勘定照合表」「残高証明書」のいずれかが必要です。</p>
</div>
